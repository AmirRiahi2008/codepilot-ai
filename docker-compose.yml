services:
  postgres:
    image: postgres:17-alpine
    container_name: codepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codepilot
      POSTGRES_PASSWORD: codepilot
      POSTGRES_DB: codepilot
    ports:
      - "5432:5432"
    volumes:
      - codepilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepilot -d codepilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: codepilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - codepilot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  codepilot_pgdata:
  codepilot_redis:
